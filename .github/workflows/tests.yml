name: Tests

on:
  push:
  pull_request:

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install Godot 4.3
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          ./godot --version

      - name: Import project
        # the first import reports errors while files are still being imported; a second pass is clean
        run: |
          ./godot --headless --path . --import || true
          ./godot --headless --path . --import

      # Godot prints thousands of harmless shutdown messages in headless mode, so each step keeps the
      # full output in test.log (uploaded if anything fails) and shows only the test report lines.
      - name: Bot match (team)
        shell: bash -o pipefail {0}
        run: ./godot --headless --fixed-fps 60 --path . res://tests/auto/BotMatchTest.tscn -- --minutes=6 2>&1 | tee -a test.log | grep -E --line-buffered "PASS|FAIL|RESULT|SCRIPT ERROR|=====|team [0-9]|events:|rejected|\\[(host|client)\\]"

      - name: Bot match (team, second seed)
        shell: bash -o pipefail {0}
        run: ./godot --headless --fixed-fps 60 --path . res://tests/auto/BotMatchTest.tscn -- --minutes=8 --seed=2024 2>&1 | tee -a test.log | grep -E --line-buffered "PASS|FAIL|RESULT|SCRIPT ERROR|=====|team [0-9]|events:|rejected|\\[(host|client)\\]"

      - name: Rules
        shell: bash -o pipefail {0}
        run: ./godot --headless --fixed-fps 60 --path . res://tests/auto/RulesTest.tscn 2>&1 | tee -a test.log | grep -E --line-buffered "PASS|FAIL|RESULT|SCRIPT ERROR|=====|team [0-9]|events:|rejected|\\[(host|client)\\]"

      - name: LAN host and client
        shell: bash -o pipefail {0}
        run: |
          ./godot --headless --path . res://tests/auto/LanTest.tscn -- --role=host --seconds=30 > host.log 2>&1 &
          HOST=$!
          ./godot --headless --path . res://tests/auto/LanTest.tscn -- --role=client --seconds=30 2>&1 | tee -a test.log | grep -E --line-buffered "PASS|FAIL|RESULT|SCRIPT ERROR|=====|team [0-9]|events:|rejected|\\[(host|client)\\]"
          wait $HOST
          grep -E "^\[host\]" host.log
          grep -q "RESULT: PASS" host.log

      - name: Upload full logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-logs
          path: |
            test.log
            host.log
