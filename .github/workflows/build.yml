name: Build Windows

# Every push to main builds the Windows .exe and publishes it as a numbered GitHub Release
# (v0.1.<run number>), so https://github.com/EvanFair/LOTR-Battle-Empires/releases/latest is always
# the newest build. The release action creates the tag on GitHub's side.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Godot 4.3 and the Windows export templates
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip && mv Godot_v4.3-stable_linux.x86_64 godot
          curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          T=~/.local/share/godot/export_templates/4.3.stable
          mkdir -p $T
          unzip -q -j templates.tpz templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe templates/version.txt -d $T
          rm templates.tpz

      - name: Import project
        run: |
          ./godot --headless --path . --import || true
          ./godot --headless --path . --import

      - name: Export
        run: |
          mkdir -p build
          ./godot --headless --path . --export-release "Windows Desktop" "build/LOTR Battle Empires.exe"
          cp CREDITS.txt build/
          cd build && zip -9 LOTR-Battle-Empires-windows.zip "LOTR Battle Empires.exe" CREDITS.txt

      - uses: actions/upload-artifact@v6
        with:
          name: LOTR-Battle-Empires-windows
          path: build/LOTR-Battle-Empires-windows.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: LOTR Battle Empires v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: build/LOTR-Battle-Empires-windows.zip
          body: |
            Windows build of LOTR Battle Empires. Unzip and double-click `LOTR Battle Empires.exe`.
            Windows SmartScreen may warn because the game isn't code-signed: click "More info" -> "Run anyway".
